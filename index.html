<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bite Sized Bandits — Walk-Up Songs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef7f5;--card:#fff;--ink:#1e2a2c;--sub:#5c7370;--line:#dcece7;--accent:#ec5f8b;--accent2:#4fb8ac;--accent-ink:#ffffff;--danger:#b3432b;--chip:#e6f5f1;--cream:#f3e6c4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1d1a;--card:#16281f;--ink:#eef7f4;--sub:#8fb0a9;--line:#22392f;--accent:#ff7ca3;--accent2:#5fd0c0;--accent-ink:#0c1f1b;--chip:#1c3229;--cream:#3a3324;}}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;}
body{margin:0;min-height:100%;background:
  radial-gradient(circle at 92% 4%, color-mix(in srgb, var(--accent2) 18%, transparent) 0, transparent 22%),
  radial-gradient(circle at 6% 14%, color-mix(in srgb, var(--accent) 16%, transparent) 0, transparent 20%),
  var(--bg);
  color:var(--ink);font-family:'Fredoka',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
h1,.brand-title{font-family:'Bungee',cursive;letter-spacing:.5px;}
header{position:sticky;top:0;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 26px;background:linear-gradient(120deg,var(--accent2) 0%,#7fd8cf 35%,var(--accent) 100%);z-index:5;overflow:hidden;}
header .row{display:flex;align-items:center;gap:12px;position:relative;z-index:2;}
header img{width:48px;height:48px;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3));flex-shrink:0;}
header .deco{position:absolute;opacity:.35;pointer-events:none;z-index:1;}
h1{font-size:1.3rem;margin:0 0 3px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.18);}
.sub{color:#fff;opacity:.92;font-size:.8rem;font-weight:500;}
.drip{height:20px;margin-top:-1px;background-image:radial-gradient(circle at 12px 0, transparent 12px, var(--cream) 12.5px);background-size:24px 22px;background-repeat:repeat-x;background-position:bottom;}
main{padding:18px 16px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 90px);max-width:640px;margin:0 auto;position:relative;}
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
button{font:inherit;cursor:pointer;}
.btn{border:2px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font-size:.85rem;font-weight:600;}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;}
input[type=text],input[type=number],input[type=password]{padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-size:.92rem;width:100%;font-family:inherit;}
label{font-size:.72rem;color:var(--sub);display:block;margin:8px 0 3px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px;}
.pcard{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:6px;min-height:135px;position:relative;overflow:hidden;box-shadow:0 3px 0 var(--line);}
.pcard::before{content:"";position:absolute;top:-16px;right:-16px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--accent));opacity:.15;}
.num{font-family:'Bungee',cursive;font-size:1.6rem;color:var(--accent);position:relative;z-index:1;}
.name{font-weight:700;font-size:1rem;position:relative;z-index:1;}
.song{font-size:.75rem;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;position:relative;z-index:1;}
.play{margin-top:auto;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;border:none;border-radius:999px;padding:11px;font-weight:700;letter-spacing:.3px;position:relative;z-index:1;box-shadow:0 3px 0 rgba(0,0,0,.15);}
.play:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.15);}
.chip{background:var(--chip);border-radius:999px;padding:7px 12px;font-size:.78rem;font-weight:600;display:inline-flex;align-items:center;gap:6px;cursor:pointer;}
.sw{width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;transition:.15s;}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--card);transition:.15s;}
.sw.on{background:var(--accent2);}
.sw.on::after{left:16px;background:var(--accent-ink);}
.status{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:.8rem;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90vw;text-align:center;}
.status.show{opacity:.95;}
.searchres{max-height:220px;overflow-y:auto;border:2px solid var(--line);border-radius:12px;margin-top:6px;}
.sres-row{padding:8px;border-bottom:1px solid var(--line);font-size:.82rem;display:flex;justify-content:space-between;gap:8px;align-items:center;}
.sres-row button{font-size:.75rem;padding:4px 10px;}
.del{align-self:flex-end;background:none;border:none;color:var(--danger);font-size:.72rem;font-weight:600;}
.hidden{display:none !important;}
.note{font-size:.75rem;color:var(--sub);margin-top:4px;}
</style>
</head>

<div class="drip"></div>
<main>
  <div class="card" id="setupCard">
    <strong>Setup</strong>
    <label>Spotify Client ID</label>
    <input type="text" id="clientId" placeholder="paste your Client ID">
    <div class="note">Redirect URI to register in your Spotify app: <code id="redirUri"></code></div>
    <button class="btn primary" id="loginBtn" style="margin-top:10px;">Log in with Spotify</button>
    <button class="btn" id="logoutBtn" style="margin-top:10px;display:none;">Log out</button>
    <hr style="border:none;border-top:1px solid var(--line);margin:14px 0;">
    <label>ElevenLabs API key (optional — for an AI announcer voice)</label>
    <input type="password" id="elKey" placeholder="paste your ElevenLabs API key">
    <label>ElevenLabs Voice ID</label>
    <input type="text" id="elVoice" placeholder="e.g. pNInz6obpgDQGcFmaJgB">
    <div class="note">Leave both blank to use your phone's built-in voice instead. Get a free key and browse voices at elevenlabs.io.</div>
  </div>

  <div id="appArea" class="hidden">
    <div class="toolbar">
      <button class="btn" id="editToggle">Edit roster</button>
      <span class="chip" id="simToggle"><span class="sw" id="simSw"></span>Song + intro together</span>
      <span class="chip" id="duckToggle"><span class="sw" id="duckSw"></span>Duck volume while talking</span>
    </div>
    <div class="card">
      <label>Song volume: <span id="songVolLabel"></span></label>
      <input type="range" id="songVol" min="0" max="100" step="1" style="width:100%;">
      <label>Ducked volume during narration: <span id="duckVolLabel"></span></label>
      <input type="range" id="duckVol" min="0" max="100" step="1" style="width:100%;">
    </div>
    <div class="toolbar">
      <button class="btn" id="exportBtn">⬇ Save backup</button>
      <button class="btn" id="importBtn">⬆ Load backup</button>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
    </div>
    <div class="card hidden" id="addCard">
      <label>New player name</label>
      <input type="text" id="newName" placeholder="Bennett Lucas">
      <label>Jersey #</label>
      <input type="number" id="newNum" placeholder="3">
      <button class="btn primary" id="addBtn" style="margin-top:10px;">+ Add player</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</main>
<div class="status" id="toast"></div>

<script src="https://sdk.scdn.co/spotify-player.js"></script>
<script>
const REDIRECT_URI = location.origin + location.pathname;
document.getElementById('redirUri').textContent = REDIRECT_URI;
const SCOPES = 'streaming user-read-email user-read-private user-modify-playback-state';

let STATE = JSON.parse(localStorage.getItem('walkup_state')||'{"settings":{"simultaneous":false,"duck":true,"songVolume":1,"duckVolume":0.25},"players":[]}');
if(STATE.settings.songVolume===undefined) STATE.settings.songVolume=1;
if(STATE.settings.duckVolume===undefined) STATE.settings.duckVolume=0.25;
let editMode=false, player=null, deviceId=null, searchTarget=null;

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2500);}
function save(){localStorage.setItem('walkup_state',JSON.stringify(STATE));}
function b64url(buf){return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
async function sha256(str){return await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));}
function randStr(len){const a=new Uint8Array(len);crypto.getRandomValues(a);return Array.from(a,b=>('0'+b.toString(16)).slice(-2)).join('').slice(0,len);}

async function login(){
  const clientId=document.getElementById('clientId').value.trim();
  if(!clientId){toast('Enter your Spotify Client ID first');return;}
  localStorage.setItem('sp_client_id',clientId);
  const verifier=randStr(64);
  localStorage.setItem('sp_verifier',verifier);
  const challenge=b64url(await sha256(verifier));
  const params=new URLSearchParams({client_id:clientId,response_type:'code',redirect_uri:REDIRECT_URI,scope:SCOPES,code_challenge_method:'S256',code_challenge:challenge});
  location.href='https://accounts.spotify.com/authorize?'+params.toString();
}

async function exchangeCode(code){
  const clientId=localStorage.getItem('sp_client_id');
  const verifier=localStorage.getItem('sp_verifier');
  const body=new URLSearchParams({client_id:clientId,grant_type:'authorization_code',code,redirect_uri:REDIRECT_URI,code_verifier:verifier});
  const res=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});
  const data=await res.json();
  if(data.access_token){ storeTokens(data); history.replaceState({},'',REDIRECT_URI); return true; }
  toast('Login failed: '+(data.error_description||data.error||'unknown error'));
  return false;
}
function storeTokens(d){
  localStorage.setItem('sp_access_token', d.access_token);
  localStorage.setItem('sp_expires_at', Date.now()+ (d.expires_in-60)*1000);
  if(d.refresh_token) localStorage.setItem('sp_refresh_token', d.refresh_token);
}
async function refreshToken(){
  const clientId=localStorage.getItem('sp_client_id');
  const rt=localStorage.getItem('sp_refresh_token');
  if(!rt) return null;
  const body=new URLSearchParams({client_id:clientId,grant_type:'refresh_token',refresh_token:rt});
  const res=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});
  const data=await res.json();
  if(data.access_token) storeTokens(data);
  return data.access_token||null;
}
async function getToken(){
  const exp=+localStorage.getItem('sp_expires_at')||0;
  if(Date.now()>exp) return await refreshToken();
  return localStorage.getItem('sp_access_token');
}
function loggedIn(){ return !!localStorage.getItem('sp_refresh_token'); }

document.getElementById('loginBtn').onclick=login;
document.getElementById('logoutBtn').onclick=()=>{ ['sp_access_token','sp_expires_at','sp_refresh_token','sp_client_id','sp_verifier'].forEach(k=>localStorage.removeItem(k)); location.reload(); };

window.onSpotifyWebPlaybackSDKReady=async ()=>{
  if(!loggedIn()) return;
  player=new Spotify.Player({name:'T-Ball Walk-Up Songs', getOAuthToken:cb=>getToken().then(cb), volume:1});
  player.addListener('ready',({device_id})=>{ deviceId=device_id; document.getElementById('statusLine').textContent='Connected — ready to play'; toast('Spotify connected'); });
  player.addListener('not_ready',()=>{ document.getElementById('statusLine').textContent='Device offline'; });
  player.addListener('authentication_error',()=>{ toast('Spotify session expired — log in again'); });
  await player.connect();
};

document.getElementById('elKey').addEventListener('change', e=>localStorage.setItem('el_api_key', e.target.value.trim()));
document.getElementById('elVoice').addEventListener('change', e=>localStorage.setItem('el_voice_id', e.target.value.trim()));

async function boot(){
  const cid=localStorage.getItem('sp_client_id');
  if(cid) document.getElementById('clientId').value=cid;
  const ek=localStorage.getItem('el_api_key'); if(ek) document.getElementById('elKey').value=ek;
  const ev=localStorage.getItem('el_voice_id'); if(ev) document.getElementById('elVoice').value=ev;
  const url=new URL(location.href);
  const code=url.searchParams.get('code');
  if(code){ await exchangeCode(code); }
  if(loggedIn()){
    document.getElementById('loginBtn').style.display='none';
    document.getElementById('logoutBtn').style.display='';
    document.getElementById('appArea').classList.remove('hidden');
    document.getElementById('statusLine').textContent='Connecting to Spotify…';
  }
  render();
}

function escAttr(s){return (s===undefined||s===null)?'':String(s).replace(/"/g,'&quot;').replace(/</g,'&lt;');}

function render(){
  document.getElementById('simSw').classList.toggle('on',STATE.settings.simultaneous);
  document.getElementById('duckSw').classList.toggle('on',STATE.settings.duck);
  document.getElementById('songVol').value=Math.round(STATE.settings.songVolume*100);
  document.getElementById('songVolLabel').textContent=Math.round(STATE.settings.songVolume*100)+'%';
  document.getElementById('duckVol').value=Math.round(STATE.settings.duckVolume*100);
  document.getElementById('duckVolLabel').textContent=Math.round(STATE.settings.duckVolume*100)+'%';
  document.getElementById('addCard').classList.toggle('hidden',!editMode);
  const grid=document.getElementById('grid'); grid.innerHTML='';
  STATE.players.forEach((p,i)=>{
    const c=document.createElement('div'); c.className='pcard';
    if(editMode){
      c.innerHTML=`<button class="del" data-del="${i}">Remove ✕</button>
        <label>Name</label><input type="text" value="${escAttr(p.name)}" data-field="name" data-i="${i}">
        <label>Jersey #</label><input type="number" value="${escAttr(p.number)}" data-field="number" data-i="${i}">
        <label>Walk-up song</label>
        <div class="song">${p.trackName? '🎵 '+escAttr(p.trackName): 'None chosen'}</div>
        <button class="btn" data-search="${i}">Search Spotify</button>
        <div class="searchres hidden" id="res-${i}"></div>
        <label>Start song at (mm:ss)</label>
        <input type="text" value="${escAttr(p.startAt)}" placeholder="0:45" data-field="startAt" data-i="${i}">`;
    } else {
      c.innerHTML=`<div class="num">#${escAttr(p.number)}</div><div class="name">${escAttr(p.name)}</div>
        <div class="song">${p.trackName? '🍦 '+escAttr(p.trackName):'No song set'}</div>
        <button class="play" data-play="${i}">▶ NOW BATTING</button>`;
    }
    grid.appendChild(c);
  });
}

document.getElementById('editToggle').onclick=()=>{editMode=!editMode;document.getElementById('editToggle').textContent=editMode?'Done editing':'Edit roster';render();};
document.getElementById('addBtn').onclick=()=>{
  const name=document.getElementById('newName').value.trim();
  const number=document.getElementById('newNum').value.trim();
  if(!name){toast('Enter a name first');return;}
  STATE.players.push({name,number,trackUri:null,trackName:null});
  document.getElementById('newName').value='';document.getElementById('newNum').value='';
  save();render();
};
document.getElementById('simToggle').onclick=()=>{STATE.settings.simultaneous=!STATE.settings.simultaneous;save();render();};
document.getElementById('duckToggle').onclick=()=>{STATE.settings.duck=!STATE.settings.duck;save();render();};
document.getElementById('songVol').addEventListener('input', e=>{
  STATE.settings.songVolume=(+e.target.value)/100;
  document.getElementById('songVolLabel').textContent=e.target.value+'%';
});
document.getElementById('songVol').addEventListener('change', ()=>save());
document.getElementById('duckVol').addEventListener('input', e=>{
  STATE.settings.duckVolume=(+e.target.value)/100;
  document.getElementById('duckVolLabel').textContent=e.target.value+'%';
});
document.getElementById('duckVol').addEventListener('change', ()=>save());

document.getElementById('exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify(STATE,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='walkup-roster-backup.json';
  document.body.appendChild(a); a.click(); a.remove();
  toast('Backup saved to your Files/Downloads');
};
document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      if(!data.players || !Array.isArray(data.players)) throw new Error('bad file');
      STATE=data; save(); render();
      toast('Roster restored from backup');
    }catch(err){ toast('That file didn\'t look like a valid backup'); }
  };
  r.readAsText(f);
  e.target.value='';
};

document.getElementById('grid').addEventListener('click', async e=>{
  const play=e.target.closest('[data-play]'); if(play) runWalkup(STATE.players[+play.dataset.play]);
  const del=e.target.closest('[data-del]'); if(del){STATE.players.splice(+del.dataset.del,1);save();render();}
  const srch=e.target.closest('[data-search]'); if(srch) doSearch(+srch.dataset.search);
  const pick=e.target.closest('[data-pick]');
  if(pick){ const p=STATE.players[searchTarget]; p.trackUri=pick.dataset.uri; p.trackName=pick.dataset.name; save(); render(); }
});
document.getElementById('grid').addEventListener('input', e=>{
  const i=e.target.dataset.i; if(i!==undefined){STATE.players[i][e.target.dataset.field]=e.target.value;}
});
document.getElementById('grid').addEventListener('change', e=>{ const i=e.target.dataset.i; if(i!==undefined) save(); });

async function doSearch(i){
  searchTarget=i;
  const box=document.getElementById('res-'+i);
  box.classList.remove('hidden'); box.innerHTML='<div class="sres-row">Type below, then tap Go</div>';
  const q=prompt('Search Spotify for a song:');
  if(!q) return;
  const token=await getToken();
  const res=await fetch('https://api.spotify.com/v1/search?type=track&limit=8&q='+encodeURIComponent(q),{headers:{Authorization:'Bearer '+token}});
  const data=await res.json();
  box.innerHTML='';
  (data.tracks? data.tracks.items:[]).forEach(t=>{
    const row=document.createElement('div'); row.className='sres-row';
    row.innerHTML=`<span>${escAttr(t.name)} — ${escAttr(t.artists.map(a=>a.name).join(', '))}</span><button data-pick data-uri="${t.uri}" data-name="${escAttr(t.name+' — '+t.artists[0].name)}">Use</button>`;
    box.appendChild(row);
  });
  if(!data.tracks || data.tracks.items.length===0) box.innerHTML='<div class="sres-row">No results</div>';
}

let voice=null;
function pickVoice(){ const vs=speechSynthesis.getVoices(); voice = vs.find(v=>/en-US/i.test(v.lang)&&/natural|enhanced|premium/i.test(v.name)) || vs.find(v=>/en-US/i.test(v.lang)) || vs[0] || null; }
speechSynthesis.onvoiceschanged=pickVoice; pickVoice();

function parseTimeToMs(s){
  if(!s) return 0;
  s=String(s).trim(); if(!s) return 0;
  const parts=s.split(':').map(x=>Number(x.trim()));
  if(parts.some(isNaN)) return 0;
  if(parts.length===2) return Math.max(0,(parts[0]*60+parts[1])*1000);
  if(parts.length===1) return Math.max(0,parts[0]*1000);
  return 0;
}

async function speak(text){
  const apiKey=localStorage.getItem('el_api_key');
  const voiceId=localStorage.getItem('el_voice_id');
  if(apiKey && voiceId){
    try{
      const res=await fetch('https://api.elevenlabs.io/v1/text-to-speech/'+voiceId,{
        method:'POST',
        headers:{'xi-api-key':apiKey,'Content-Type':'application/json','Accept':'audio/mpeg'},
        body:JSON.stringify({text, model_id:'eleven_monolingual_v1', voice_settings:{stability:0.35,similarity_boost:0.8,style:0.4,use_speaker_boost:true}})
      });
      if(!res.ok) throw new Error('ElevenLabs error '+res.status);
      const blob=await res.blob();
      const url=URL.createObjectURL(blob);
      const audio=new Audio(url);
      await new Promise(resolve=>{ audio.onended=resolve; audio.onerror=resolve; audio.play().catch(resolve); });
      return;
    }catch(e){ toast('AI voice unavailable, using device voice'); }
  }
  await new Promise(resolve=>{
    const utter=new SpeechSynthesisUtterance(text); if(voice) utter.voice=voice; utter.rate=0.95; utter.pitch=0.95;
    utter.onend=resolve; utter.onerror=resolve;
    speechSynthesis.cancel(); speechSynthesis.speak(utter);
  });
}

async function ensureActiveDevice(){
  const token=await getToken();
  await fetch('https://api.spotify.com/v1/me/player', {method:'PUT', headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}, body:JSON.stringify({device_ids:[deviceId],play:false})});
}
async function playTrack(uri, vol, startMs){
  if(!deviceId){toast('Spotify device not ready yet');return;}
  const token=await getToken();
  await player.setVolume(vol);
  const body={uris:[uri]};
  if(startMs) body.position_ms=startMs;
  await fetch('https://api.spotify.com/v1/me/player/play?device_id='+deviceId,{method:'PUT',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(body)});
}
function rampVolume(target){
  let v=STATE.settings.duckVolume; const step=async()=>{ v=Math.min(target,v+0.1); await player.setVolume(v); if(v<target) requestAnimationFrame(step); };
  step();
}
let deviceArmed=false;
async function runWalkup(p){
  if(!deviceId){toast('Waiting for Spotify to connect…');return;}
  if(!deviceArmed){ await ensureActiveDevice(); deviceArmed=true; }
  const text=`Now batting, number ${p.number||''}, ${p.name}`.replace(/\s+/g,' ').trim();
  const hasTrack=!!p.trackUri;
  const duck=STATE.settings.duck && hasTrack;
  const simultaneous=STATE.settings.simultaneous;
  const startMs=parseTimeToMs(p.startAt);
  const fullVol=STATE.settings.songVolume;
  const duckVol=STATE.settings.duckVolume;
  if(hasTrack && simultaneous){
    await playTrack(p.trackUri, duck?duckVol:fullVol, startMs);
    await speak(text);
    if(duck) rampVolume(fullVol);
  } else if(hasTrack && !simultaneous){
    await speak(text);
    await playTrack(p.trackUri, fullVol, startMs);
  } else {
    toast('No song set for this player');
    await speak(text);
  }
}

boot();
</script>
